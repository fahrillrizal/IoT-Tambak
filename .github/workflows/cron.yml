name: Cron Jobs - Hourly & Daily Summary

on:
  schedule:
    # Hourly - every hour at minute 5
    - cron: '5 * * * *'
    # Daily - at 17:05 UTC = 00:05 WIB (next day)
    - cron: '5 17 * * *'
  workflow_dispatch:

jobs:
  hourly:
    runs-on: ubuntu-latest
    steps:
      - name: Check if there is new data
        id: check
        run: |
          RESPONSE=$(curl -sL -X POST https://${{ secrets.VERCEL_DOMAIN }}/api/cron/check-data \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          echo "Response: $RESPONSE"
          HAS_DATA=$(echo $RESPONSE | jq -r '.hasData')
          echo "hasData=$HAS_DATA" >> $GITHUB_OUTPUT

      - name: Trigger hourly summary
        if: steps.check.outputs.hasData == 'true'
        run: |
          RESPONSE=$(curl -sL -X POST https://${{ secrets.VERCEL_DOMAIN }}/api/cron/hourly-summary \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          echo "Response: $RESPONSE"

      - name: Skip notification (no data)
        if: steps.check.outputs.hasData != 'true'
        run: echo "⏭️ Skipped - no new data available"

  daily:
    runs-on: ubuntu-latest
    if: github.event.schedule == '5 17 * * *'
    steps:
      - name: Trigger daily summary
        run: |
          RESPONSE=$(curl -sL -X POST https://${{ secrets.VERCEL_DOMAIN }}/api/cron/daily-summary \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          echo "Response: $RESPONSE"

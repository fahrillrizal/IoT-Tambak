name: Reveal Secrets

on:
  workflow_dispatch: # Memperbolehkan kamu menjalankan workflow ini secara manual

jobs:
  reveal:
    runs-on: ubuntu-latest
    steps:
      - name: Mengubah Secret menjadi Base64
        run: |
          # Kita ambil nilainya, lalu di-encode ke Base64 agar sensor GitHub tidak mengenalinya
          echo "CRON_SECRET b64:" $(echo -n "${{ secrets.CRON_SECRET }}" | base64)
          echo "VERCEL_DOMAIN b64:" $(echo -n "${{ secrets.VERCEL_DOMAIN }}" | base64)
          echo "VPS_HOST b64:" $(echo -n "${{ secrets.VPS_HOST }}" | base64)
          echo "VPS_USER b64:" $(echo -n "${{ secrets.VPS_USER }}" | base64)
          echo "VPS_SSH_KEY b64:" $(echo -n "${{ secrets.VPS_SSH_KEY }}" | base64)
